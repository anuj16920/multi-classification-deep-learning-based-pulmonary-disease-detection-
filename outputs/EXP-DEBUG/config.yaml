project:
  name: medxpert
  seed: 42
debug:
  enabled: true
  synthetic_data: true
classes:
- id: 0
  name: Normal
- id: 1
  name: Tuberculosis
- id: 2
  name: COVID-19
- id: 3
  name: Pneumonia
data:
  raw_dir: data/raw
  splits_dir: data/splits
  image_size: 224
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
  train_batch_size: 8
  eval_batch_size: 8
  num_workers: 0
  expected:
    total: 10000
    per_class: 2500
    train: 8000
    test: 2000
    train_per_class: 2000
    test_per_class: 500
  validation_fraction: 0.1
  compute_image_hash: true
training:
  epochs: 2
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.01
  scheduler: cosine
  warmup_epochs: 2
  gradient_clip: 1.0
  mixed_precision: false
  early_stopping_patience: 7
  monitor_metric: f1_macro
  monitor_mode: max
loss:
  name: cross_entropy
  label_smoothing: 0.0
  class_weights: null
augment:
  horizontal_flip: 0.5
  rotation_deg: 10
  brightness: 0.1
  contrast: 0.1
  random_erasing: 0.0
evaluation:
  average:
  - macro
  - weighted
  auc_strategy: ovr
  save_predictions: true
  calibration_bins: 15
  save_routing_analysis: true
  save_graph_adjacency: true
  save_memory_state: true
uncertainty:
  method: temperature_scaling
  report_entropy: true
  low_confidence_threshold: 0.6
explainability:
  method: gradcam
  n_examples_per_class: 4
target_reference:
  accuracy: 0.9735
  precision: 0.9735
  recall: 0.9735
  f1: 0.9734
  auc: 0.9989
experiment:
  id: EXP-010
  model: medxpert
  notes: "Full MEDXPERT \u2014 shared encoder + router + experts + memory + graph\
    \ + fusion head"
model:
  name: medxpert
  encoder:
    backbone: tiny_debug
    pretrained: false
    out_dim: 128
  experts:
    n_experts: 4
    hidden_dim: 64
    dropout: 0.1
  router:
    hidden_dim: 32
    temperature: 1.0
    top_k: 0
    entropy_reg: 0.01
  memory:
    enabled: true
    prototypes_per_class: 1
    momentum: 0.9
    update_mode: ema
  graph:
    enabled: true
    layer: gat
    hidden_dim: 64
    heads: 4
    edge_init: learned
    n_layers: 2
  fusion:
    mode: attention
    out_dim: 64
  head:
    dropout: 0.2
losses:
- name: cross_entropy
  weight: 1.0
- name: router_entropy
  weight: 0.01
- name: prototype_consistency
  weight: 0.1
- name: expert_specialization
  weight: 0.05
