[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medxpert"
version = "0.1.0"
description = "MEDXPERT: Graph-Guided Collaborative Multi-Expert Framework with Adaptive Expert Memory for chest X-ray classification"
requires-python = ">=3.10"
readme = "README.md"
authors = [{name = "MEDXPERT research scaffold"}]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
